name: Windows CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Windows x64 build and test
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Set up Python for TOML parsing
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Verify tag matches package version
        if: github.ref_type == 'tag'
        shell: python
        run: |
          import os
          import tomllib

          with open("mcpp.toml", "rb") as manifest:
              version = tomllib.load(manifest)["package"]["version"]
          expected = f"v{version}"
          actual = os.environ["GITHUB_REF_NAME"]
          if actual != expected:
              raise ValueError(f"Tag {actual} must match package version {expected}")
          print(f"Verified {actual} matches [package].version.")

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: amd64

      - name: Install mcpp
        run: |
          $ErrorActionPreference = 'Stop'
          $mcppVersion = '2026.10.17.1'
          $mcppSha256 = 'ed3f3ef28d6c54d1c1e26998794db6f0349cd1659b4212e091c8b982c1c4851e'
          $archiveName = "mcpp-$mcppVersion-windows-x86_64"
          $archivePath = Join-Path $env:RUNNER_TEMP "$archiveName.zip"
          $installRoot = Join-Path $env:RUNNER_TEMP $archiveName

          Invoke-WebRequest -Uri "https://github.com/mcpp-community/mcpp/releases/download/v$mcppVersion/$archiveName.zip" -OutFile $archivePath
          if ((Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash -ne $mcppSha256) {
              throw 'The mcpp release archive checksum does not match.'
          }
          Expand-Archive -LiteralPath $archivePath -DestinationPath $env:RUNNER_TEMP -Force

          $mcppBin = Join-Path $installRoot 'bin'
          $mcppExe = Join-Path $mcppBin 'mcpp.exe'
          if (!(Test-Path -LiteralPath $mcppExe)) {
              throw 'The mcpp release archive does not contain bin/mcpp.exe.'
          }
          # Keep the bundled registry/bin/xlings.exe in this isolated MCPP_HOME.
          $env:MCPP_HOME = $installRoot
          $env:PATH = "$mcppBin;$env:PATH"
          "MCPP_HOME=$installRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $mcppBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $mcppExe --version
          if ($LASTEXITCODE -ne 0) {
              throw "mcpp --version failed with exit code $LASTEXITCODE."
          }

      - name: Install LLVM toolchain
        run: mcpp toolchain install llvm 23.1.3

      - name: Select LLVM toolchain
        run: mcpp toolchain default llvm@23.1.3

      - name: Build
        run: mcpp build --locked

      - name: Check public Asio boundary
        run: python tools/check_asio_boundary.py

      - name: Verify implementation partitions
        run: python tools/check_module_boundary.py

      - name: Test private transport implementation
        run: python tools/check_transport.py

      - name: Test private HTTP sessions
        run: python tools/check_session.py

      - name: Test public HTTP listeners
        run: python tools/check_server.py

      - name: Test private HTTP clients
        run: python tools/check_client.py

      - name: Test optional JSON consumers
        run: python tools/check_json.py

      - name: Test REST examples
        run: python tools/check_examples.py

      - name: Test
        run: mcpp test --timeout 30

      - name: Verify test harness failure paths
        run: python tools/check_test_support.py

  release:
    name: Publish GitHub Release
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: test
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
              Write-Output "Release $env:RELEASE_TAG already exists; nothing to create"
              exit 0
          }

          $version = $env:RELEASE_TAG.Substring(1)
          $releaseArgs = @(
              'release', 'create', $env:RELEASE_TAG,
              '--verify-tag', '--generate-notes',
              '--title', "mhttp $version"
          )
          if (($version -split '\+', 2)[0].Contains('-')) {
              $releaseArgs += '--prerelease'
          }
          gh @releaseArgs
          if ($LASTEXITCODE -ne 0) {
              throw "Failed to publish release $env:RELEASE_TAG"
          }
