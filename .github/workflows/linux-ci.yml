name: Linux CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Linux x64 build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Verify tag matches package version
        if: github.ref_type == 'tag'
        shell: python3 {0}
        run: |
          import os
          import tomllib

          with open("mcpp.toml", "rb") as manifest:
              version = tomllib.load(manifest)["package"]["version"]
          expected = f"v{version}"
          actual = os.environ["GITHUB_REF_NAME"]
          if actual != expected:
              raise ValueError(f"Tag {actual} must match package version {expected}")
          print(f"Verified {actual} matches [package].version.")

      - name: Install mcpp
        env:
          MCPP_VERSION: '2026.10.17.1'
          MCPP_SHA256: '75c362a4f7c5dd4282121a3536dd56a173fa2046dd9609882d720ad249d73f7f'
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/mcpp-$MCPP_VERSION-linux-x86_64.tar.gz"
          install_root="$RUNNER_TEMP/mcpp-$MCPP_VERSION-linux-x86_64"

          curl --fail --location --retry 3 \
            "https://github.com/mcpp-community/mcpp/releases/download/v$MCPP_VERSION/mcpp-$MCPP_VERSION-linux-x86_64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$MCPP_SHA256" "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP"

          if [ ! -x "$install_root/bin/mcpp" ]; then
            echo 'The mcpp release archive does not contain bin/mcpp.' >&2
            exit 1
          fi
          # Keep the bundled registry/bin/xlings in this isolated MCPP_HOME.
          echo "MCPP_HOME=$install_root" >> "$GITHUB_ENV"
          echo "$install_root/bin" >> "$GITHUB_PATH"
          "$install_root/bin/mcpp" --version

      - name: Install LLVM toolchain
        run: mcpp toolchain install llvm 23.1.3

      - name: Select LLVM toolchain
        run: mcpp toolchain default llvm@23.1.3

      - name: Build
        run: mcpp build

      - name: Check public Asio boundary
        run: python3 tools/check_asio_boundary.py

      - name: Verify implementation partitions
        run: python3 tools/check_module_boundary.py

      - name: Test private transport implementation
        run: python3 tools/check_transport.py

      - name: Test private HTTP sessions
        run: python3 tools/check_session.py

      - name: Test public HTTP listeners
        run: python3 tools/check_server.py

      - name: Test private HTTP clients
        run: python3 tools/check_client.py

      - name: Test optional JSON consumers
        run: python3 tools/check_json.py

      - name: Test REST examples
        run: python3 tools/check_examples.py

      - name: Test stress example
        run: python3 tools/check_stress.py

      - name: Test
        run: mcpp test --timeout 30

      - name: Verify test harness failure paths
        run: python3 tools/check_test_support.py
