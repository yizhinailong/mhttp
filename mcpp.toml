[package]
name = "mhttp"
version = "0.1.0"
standard = "c++23"
description = "An asynchronous server built on standalone Asio"
license = "MIT"

[toolchain]
default = "llvm@23.1.3"

[lib]
path = "src/mhttp.cppm"

[targets.mhttp]
kind = "lib"

[targets.rest_server]
kind = "bin"
main = "examples/rest_server/main.cpp"

[targets.rest_client]
kind = "bin"
main = "examples/rest_client/main.cpp"

[dependencies.chriskohlhoff]
asio = "1.38.1"

[features]
default = []
json = { sources = ["src/core/json.cppm"] }

[feature-deps.json]
nlohmann.json = "3.12.0"

[test]
discover = ["tests/**/*.cpp", "!tests/json/**/*.cpp"]
